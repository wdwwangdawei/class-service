<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵动岛</title>
<style>
  :root {
    --top: 6px;
    --main-w: 240px;
    --alert-width: 300px;
    --dur: 320ms;
    --dur-fast: 160ms;
    --ring: #0a84ff;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #island {
    position: absolute;
    left: 50%;
    top: var(--top);
    width: 240px;
    height: 40px;
    border-radius: 20px;
    background: #1c1c1e;
    color: #fff;
    display: flex;
    align-items: center;
    padding-left: 6px;
    overflow: hidden;
    cursor: pointer;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    transition: width var(--geo-dur, 235ms) cubic-bezier(0.33, 1, 0.68, 1),
                transform var(--geo-dur, 235ms) cubic-bezier(0.33, 1, 0.68, 1),
                opacity 120ms ease;
    will-change: width, transform;
  }
  body[data-state="mini"] #island { width: 48px; padding-left: 0; }
  body[data-state="compact"] #island { width: 240px; }
  body[data-state="countdown"] #island { width: 600px; }
  body[data-state="alert"] #island { width: var(--alert-width); padding-left: 0; }
  body[data-state="hidden"] #island {
    width: 48px;
    transform: translateX(-50%) translateY(calc(-40px - var(--top) - 18px));
  }
  #ringWrap {
    flex: 0 0 28px;
    width: 28px;
    height: 40px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #ringSvg { display: block; }
  #ringProgress { transition: stroke-dashoffset 500ms ease, stroke 300ms ease; }
  #miniDot {
    display: none;
    position: absolute;
    left: 50%;
    top: 50%;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: #8a8a8e;
  }
  body[data-state="mini"] #ringSvg { display: none; }
  body[data-state="mini"] #miniDot { display: block; }
  #countFill {
    position: absolute;
    left: 1px;
    top: 1px;
    bottom: 1px;
    width: max(0px, calc(100% * var(--fill, 0) - 1px));
    border-radius: 19px;
    background: #0a84ff;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: width 260ms linear, opacity 160ms ease;
  }
  body[data-state="countdown"] #countFill { opacity: 1; }
  #countSheen {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: max(40px, 50%);
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.275), rgba(255, 255, 255, 0));
    transform: translateX(-100%);
    animation: count-sheen 1400ms linear infinite;
  }
  @keyframes count-sheen {
    from { transform: translateX(-100%); }
    to { transform: translateX(300%); }
  }
  #countGlow {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 20px;
    background: linear-gradient(90deg, rgba(120, 200, 255, 0), rgba(150, 210, 255, 0.78));
  }
  #countDot {
    position: absolute;
    top: 50%;
    right: 7.6px;
    width: 22.8px;
    height: 22.8px;
    margin-top: -11.4px;
    border-radius: 50%;
    background: rgba(235, 245, 255, 0.9);
  }
  #ringWrap, #textWrap { position: relative; z-index: 1; }
  #textWrap {
    flex: 1 1 auto;
    min-width: 0;
    height: 40px;
    overflow: hidden;
    white-space: nowrap;
  }
  .itxt {
    position: absolute;
    left: 8px;
    right: 10px;
    top: 0;
    height: 40px;
    line-height: 40px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    white-space: nowrap;
    opacity: 1;
  }
  #islandTextNew { opacity: 0; }
  .itxt.marquee { animation: marquee-scroll 6s ease-in-out infinite alternate; }
  @keyframes marquee-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(var(--shift, 0)); }
  }
  body[data-state="mini"] #textWrap { opacity: 0; }
  body[data-state="mini"] .itxt { opacity: 0; }
  body[data-state="alert"] #ringWrap { display: none; }
  body[data-state="alert"] #textWrap {
    text-align: center;
  }
  body[data-state="alert"] .itxt {
    left: 18px;
    right: 18px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  body[data-state="alert"][data-alert-type="success"] .itxt { color: #30d158; }

  #sub {
    position: absolute;
    top: var(--top);
    left: 462px;
    height: 40px;
    min-width: 158px;
    border-radius: 20px;
    background: #1c1c1e;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 0 10px;
    white-space: nowrap;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-16px) scale(0.92);
    transition: left var(--dur) var(--ease), width var(--dur) var(--ease), padding var(--dur) var(--ease),
                opacity var(--dur-fast) ease, transform var(--dur) var(--ease);
    overflow: hidden;
  }
  body.sub-on #sub { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
  #sub.collapsed { width: 40px; min-width: 40px; padding: 0; justify-content: center; }
  #subText {
    font-size: 13px;
    white-space: nowrap;
    transition: opacity var(--dur-fast) ease;
  }
  #sub.collapsed #subText { opacity: 0; width: 0; }
  #subMark {
    display: none;
    font-size: 18px;
    font-family: "Segoe UI Emoji", "Microsoft YaHei UI", sans-serif;
    color: #fff;
    line-height: 40px;
  }
  #sub.collapsed #subMark { display: block; }

  #panel {
    position: absolute;
    left: 50%;
    top: calc(var(--top) + 44px);
    width: 240px;
    height: 0;
    background: #1c1c1e;
    border-radius: 8px;
    color: #e6e6e6;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateX(-50%) translateY(6px);
    transform-origin: top center;
    transition: height var(--panel-dur, 320ms) cubic-bezier(0.33, 1, 0.68, 1),
                opacity 160ms ease,
                transform var(--panel-dur, 320ms) cubic-bezier(0.33, 1, 0.68, 1),
                visibility 0s linear var(--panel-dur, 320ms);
  }
  #panel.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
    transition: height var(--panel-dur, 320ms) cubic-bezier(0.33, 1, 0.68, 1),
                opacity 160ms ease,
                transform var(--panel-dur, 320ms) cubic-bezier(0.33, 1, 0.68, 1),
                visibility 0s;
  }
  body:not(.fade-panel) #panel { transition: none; }
  #panelBody {
    padding: 12px;
    font-size: 13px;
    line-height: 22px;
    white-space: nowrap;
  }
  .p-line { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-state="hidden" data-alert-type="info">
  <div id="island">
    <div id="countFill">
      <div id="countSheen"></div>
      <div id="countGlow"></div>
      <div id="countDot"></div>
    </div>
    <div id="ringWrap">
      <svg id="ringSvg" width="28" height="28" viewBox="0 0 28 28">
        <circle cx="14" cy="14" r="12" fill="none" stroke="#3a3a3c" stroke-width="2"></circle>
        <circle id="ringProgress" cx="14" cy="14" r="12" fill="none" stroke="#8a8a8e" stroke-width="2"
                stroke-linecap="round" stroke-dasharray="75.4" stroke-dashoffset="75.4"
                transform="rotate(-90 14 14)"></circle>
      </svg>
      <div id="miniDot"></div>
    </div>
    <div id="textWrap">
      <span id="islandText" class="itxt">今日无课</span>
      <span id="islandTextNew" class="itxt"></span>
    </div>
  </div>

  <div id="sub" class="collapsed">
    <span id="subText"></span>
    <span id="subMark"></span>
  </div>

  <div id="panel">
    <div id="panelBody"></div>
  </div>

  <script>
    const api = window.islandAPI;
    const island = document.getElementById('island');
    const sub = document.getElementById('sub');
    const subText = document.getElementById('subText');
    const subMark = document.getElementById('subMark');
    const panel = document.getElementById('panel');
    const panelBody = document.getElementById('panelBody');
    const textA = document.getElementById('islandText');
    const textB = document.getElementById('islandTextNew');
    let textEl = textA;
    let idleTextEl = textB;
    const ringProgress = document.getElementById('ringProgress');
    const countFill = document.getElementById('countFill');
    const miniDot = document.getElementById('miniDot');

    const RING_LENGTH = 75.4;
    const state = {
      config: {
        show_island: true,
        island_top_margin: 6,
        island_alert_width: 300,
        island_alert_hold_ms: 600,
        island_hide_on_fullscreen: true,
        island_show_wakeup_anim: true,
        show_sub_island: false,
        sub_island_collapsed: false,
        sub_island_auto_collapse_sec: 5,
        anim_fade_panel: true,
        anim_fade_text: true,
        anim_duration: 320
      },
      locked: false,
      visible: false,
      phase: 'hidden',
      alertType: 'info',
      alertTimer: null,
      panelTimer: null,
      panelOpen: false,
      subCollapsed: true,
      subTimer: null,
      data: null,
      schedule: null,
      status: null,
      lastText: '',
      lastSubText: '',
      lastStatusKind: '',
      countdownKey: '',
      countdownWindow: 60,
      lastInteractive: null,
      lastMouse: { x: -1, y: -1 },
      rolling: false,
      fillTuned: false
    };

    function clamp(n, min, max, fallback) {
      const v = parseInt(n, 10);
      if (isNaN(v)) return fallback;
      return Math.max(min, Math.min(max, v));
    }

    function currentSchedule() {
      return state.schedule || (state.data && state.data.schedule) || null;
    }

    function dayCourses(schedule, now) {
      const key = String((now.getDay() + 6) % 7);
      const courses = (schedule.timetable && schedule.timetable[key]) || [];
      const list = [];
      (schedule.periods || []).forEach(function (period, index) {
        const course = String(courses[index] || '').trim();
        if (!course) return;
        list.push({ index: index, period: period.name, course: course, start: period.start, end: period.end });
      });
      return list;
    }

    function timeToDate(now, hhmm) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
      if (!m) return null;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), Number(m[1]), Number(m[2]), 0, 0);
    }

    function computeStatus(schedule, now) {
      const courses = dayCourses(schedule, now);
      if (!courses.length) return { status: 'none' };
      const advanceSec = Math.max(0, Number(schedule.advanceMinutes) || 0) * 60;
      for (let i = 0; i < courses.length; i++) {
        const item = courses[i];
        const rawStart = timeToDate(now, item.start);
        let rawEnd = timeToDate(now, item.end);
        if (!rawStart || !rawEnd) continue;
        if (rawEnd <= rawStart) rawEnd = new Date(rawEnd.getTime() + 24 * 3600 * 1000);
        const start = new Date(rawStart.getTime() - advanceSec * 1000);
        const end = rawEnd;
        if (now >= start && now <= end) {
          const remainSec = Math.max(0, Math.floor((end.getTime() - now.getTime()) / 1000));
          return {
            status: 'ongoing', course: item.course, period: item.period,
            start: item.start, end: item.end, index: item.index,
            remainSec: remainSec,
            remainMin: Math.max(1, Math.ceil(remainSec / 60)),
            durationSec: Math.max(1, Math.floor((end.getTime() - start.getTime()) / 1000))
          };
        }
        if (now < start) {
          const untilSec = Math.max(0, Math.floor((start.getTime() - now.getTime()) / 1000));
          return {
            status: 'upcoming', course: item.course, period: item.period,
            start: item.start, index: item.index, untilSec: untilSec,
            untilMin: Math.max(1, Math.ceil(untilSec / 60)), advanceSec: advanceSec
          };
        }
      }
      return { status: 'done' };
    }

    function statusText(schedule, status) {
      if (!status) return '今日无课';
      if (status.status === 'upcoming') {
        const countdownSec = (schedule && schedule.countdownSec) || 60;
        if (status.untilSec <= countdownSec) return '下节 ' + status.course + ' · ' + status.untilSec + 's';
        return '下节 ' + status.course + ' · ' + status.untilMin + '分钟后';
      }
      if (status.status === 'ongoing') return '本节：' + status.course + ' 还剩 ' + status.remainMin + '分钟';
      if (status.status === 'none') return '今日无课';
      return '今日课程已结束';
    }

    function subStatusText(status) {
      if (!status) return '';
      if (status.status === 'upcoming') return '下节 ' + status.course + ' · ' + status.start;
      if (status.status === 'ongoing') return '本节 ' + status.course + ' · 至 ' + status.end;
      if (status.status === 'none') return '今日无课';
      return '今日课程已结束';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function refreshSchedule(forceText) {
      const schedule = currentSchedule();
      const prevKind = state.lastStatusKind;
      const prevCourse = state.status ? state.status.course : '';
      state.status = schedule ? computeStatus(schedule, new Date()) : null;
      state.lastStatusKind = state.status ? state.status.status : '';
      const countdownSec = (schedule && schedule.countdownSec) || 60;
      const upcoming = state.status && state.status.status === 'upcoming' && state.status.untilSec > 0;
      const inCountdown = upcoming && state.status.untilSec <= countdownSec;
      if (inCountdown) {
        const key = state.status.course + '@' + state.status.start;
        if (state.countdownKey !== key) {
          state.countdownKey = key;
          state.countdownWindow = Math.max(1, countdownSec);
          state.fillTuned = false;
        }
        if (state.phase === 'compact' || state.phase === 'mini') {
          enterCountdown();
        } else if (state.phase === 'countdown' && !state.fillTuned) {
          tuneCountFill();
        }
      } else {
        state.countdownKey = '';
        if (state.phase === 'countdown') applyPhase('compact');
      }
      updateRing();
      if (schedule) {
        const text = statusText(schedule, state.status);
        if (state.phase === 'compact' || state.phase === 'mini' || state.phase === 'countdown') {
          if (forceText || text !== state.lastText) {
            const kind = state.status ? state.status.status : '';
            const allowRoll = !forceText && prevKind === kind && prevCourse === (state.status && state.status.course)
              && (kind === 'upcoming' || kind === 'ongoing');
            state.lastText = text;
            setText(text, false, allowRoll);
          }
        }
      }
      if (state.phase === 'countdown' && state.status && state.status.untilSec != null) {
        const ratio = Math.max(0, Math.min(1, state.status.untilSec / Math.max(1, state.countdownWindow)));
        island.style.setProperty('--fill', String(ratio));
      }
      if (prevKind === 'upcoming' && state.status && state.status.status === 'ongoing'
          && state.visible && state.phase !== 'alert') {
        showAlert({ text: '上课了！', type: 'success', ms: state.config.island_alert_hold_ms });
      }
      if (state.panelOpen) renderPanel();
      renderSub();
    }

    function tuneCountFill() {
      state.fillTuned = true;
      const ratio = state.status && state.status.untilSec != null
        ? Math.max(0, Math.min(1, state.status.untilSec / Math.max(1, state.countdownWindow)))
        : 0;
      island.style.setProperty('--fill', '0');
      countFill.style.transition = 'none';
      void countFill.offsetWidth;
      countFill.style.transition = 'width 180ms cubic-bezier(0.33, 1, 0.68, 1), opacity 160ms ease';
      requestAnimationFrame(() => {
        if (state.phase === 'countdown') island.style.setProperty('--fill', String(ratio));
      });
      setTimeout(() => {
        if (state.phase === 'countdown') {
          countFill.style.transition = 'width 260ms linear, opacity 160ms ease';
        }
      }, 200);
    }

    function enterCountdown() {
      applyPhase('countdown');
      tuneCountFill();
      updateSubLayout();
      renderSub();
    }

    function applyConfig(cfg) {
      if (!cfg) return;
      const merged = Object.assign({}, state.config, cfg);
      state.config = merged;
      if (merged.schedule) state.schedule = merged.schedule;
      const root = document.documentElement.style;
      root.setProperty('--top', clamp(merged.island_top_margin, 0, 100, 6) + 'px');
      root.setProperty('--alert-width', clamp(merged.island_alert_width, 200, 800, 300) + 'px');
      const dur = clamp(merged.anim_duration, 100, 2000, 320);
      root.setProperty('--dur', dur + 'ms');
      root.setProperty('--panel-dur', clamp(dur, 100, 500, 320) + 'ms');
      root.setProperty('--dur-fast', Math.max(90, Math.round(dur / 2)) + 'ms');
      document.body.classList.toggle('fade-panel', merged.anim_fade_panel !== false);
      document.body.classList.toggle('fade-text', merged.anim_fade_text !== false);
      state.subCollapsed = merged.sub_island_collapsed === true;
      updateSubLayout();
      renderSub();
      updateRing();
      setMainWidthVar();
      refreshSchedule(false);
    }

    function setMainWidthVar() {
      let width = 240;
      if (state.phase === 'mini' || state.phase === 'hidden') width = 48;
      if (state.phase === 'countdown') width = 600;
      if (state.phase === 'alert') width = clamp(state.config.island_alert_width, 200, 800, 300);
      document.documentElement.style.setProperty('--main-w', width + 'px');
      updateSubLayout();
    }

    function updateSubLayout() {
      const width = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--main-w'), 10) || 240;
      const left = Math.round(window.innerWidth / 2 + width / 2 + 8);
      sub.style.left = left + 'px';
    }

    function applyMarquee(el) {
      el.classList.remove('marquee');
      el.style.removeProperty('--shift');
      requestAnimationFrame(() => {
        const wrap = el.parentElement;
        const overflow = el.scrollWidth - wrap.clientWidth;
        if (overflow > 2) {
          el.style.setProperty('--shift', (-overflow) + 'px');
          el.style.animationDuration = Math.max(4, Math.round(overflow / 22)) + 's';
          el.classList.add('marquee');
        }
      });
    }

    function setTextInstant(value, skipMarquee) {
      state.rolling = false;
      textA.getAnimations().forEach((a) => a.cancel());
      textB.getAnimations().forEach((a) => a.cancel());
      textA.style.removeProperty('transform');
      textB.style.removeProperty('transform');
      const el = textEl;
      el.textContent = value;
      el.style.opacity = '1';
      idleTextEl.style.opacity = '0';
      idleTextEl.classList.remove('marquee');
      idleTextEl.style.removeProperty('--shift');
      if (skipMarquee) {
        el.classList.remove('marquee');
        el.style.removeProperty('--shift');
      } else {
        applyMarquee(el);
      }
    }

    function rollText(value) {
      const from = textEl;
      const to = idleTextEl;
      from.getAnimations().forEach((a) => a.cancel());
      to.getAnimations().forEach((a) => a.cancel());
      from.style.transform = '';
      to.style.transform = '';
      to.textContent = value;
      to.classList.remove('marquee');
      to.style.removeProperty('--shift');
      const dur = Math.max(120, Math.min(400, Math.round((state.config.anim_duration || 320) * 0.7)));
      const ease = 'cubic-bezier(0.33, 1, 0.68, 1)';
      from.style.opacity = '1';
      to.style.opacity = '1';
      const a1 = from.animate([
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-40px)', opacity: 0 }
      ], { duration: dur, easing: ease, fill: 'forwards' });
      const a2 = to.animate([
        { transform: 'translateY(40px)', opacity: 0 },
        { transform: 'translateY(0)', opacity: 1 }
      ], { duration: dur, easing: ease, fill: 'forwards' });
      state.rolling = true;
      a2.onfinish = () => {
        state.rolling = false;
        a1.cancel();
        a2.cancel();
        from.style.opacity = '0';
        from.classList.remove('marquee');
        from.style.removeProperty('--shift');
        from.style.transform = '';
        to.style.opacity = '1';
        to.style.transform = '';
        textEl = to;
        idleTextEl = from;
        applyMarquee(to);
      };
    }

    function setText(text, isAlert, allowRoll) {
      const value = String(text == null ? '' : text);
      if (!isAlert && allowRoll && state.phase === 'compact'
          && state.config.anim_fade_text !== false) {
        rollText(value);
      } else {
        setTextInstant(value, isAlert === true);
      }
    }

    function applyPhase(phase, instant) {
      const from = state.phase;
      const dur = instant ? 0 : geoDur(from, phase);
      document.documentElement.style.setProperty('--geo-dur', dur + 'ms');
      state.phase = phase;
      document.body.dataset.state = phase;
      setMainWidthVar();
      renderSub();
    }

    function geoDur(from, to) {
      const widths = {
        hidden: 48,
        mini: 48,
        compact: 240,
        countdown: 600,
        alert: clamp(state.config.island_alert_width, 200, 800, 300)
      };
      const wf = widths[from] != null ? widths[from] : 240;
      const wt = widths[to] != null ? widths[to] : 240;
      const yf = from === 'hidden' ? -(40 + 18) : 0;
      const yt = to === 'hidden' ? -(40 + 18) : 0;
      const dist = Math.max(Math.abs(wt - wf), Math.abs(yt - yf));
      return Math.max(120, Math.min(320, Math.round(120 + dist * 0.6)));
    }

    function setPhase(phase) {
      applyPhase(phase);
      if (phase === 'compact' || phase === 'mini') {
        refreshSchedule(true);
      }
    }

    function updateRing() {
      const schedule = currentSchedule();
      const status = state.status;
      let ratio = 0;
      let color = '#8a8a8e';
      if (schedule && status) {
        if (status.status === 'upcoming') {
          if (state.phase === 'countdown') {
            ratio = (status.untilSec || 0) / Math.max(1, state.countdownWindow);
          } else {
            const total = Math.max(1, status.advanceSec || 0, status.countdownSec || 0, status.untilSec || 0);
            ratio = status.untilSec / total;
          }
          color = '#4da3ff';
        } else if (status.status === 'ongoing') {
          ratio = status.remainSec / Math.max(1, status.durationSec || 0);
          color = '#30d158';
        }
      }
      miniDot.style.background = color;
      ringProgress.style.stroke = color;
      ringProgress.style.strokeDashoffset = String(RING_LENGTH * (1 - Math.max(0, Math.min(1, ratio))));
    }

    function isActuallyVisible() {
      const cfg = state.config;
      return cfg.show_island !== false && !state.locked;
    }

    function wake() {
      if (!state.visible) return;
      clearTimeout(state.alertTimer);
      state.alertTimer = null;
      closePanel();
      if (state.config.island_show_wakeup_anim !== false) {
        applyPhase('hidden', true);
        void island.offsetWidth;
        requestAnimationFrame(() => {
          if (!state.visible) return;
          setPhase('mini');
          setTimeout(() => {
            if (state.visible && state.phase === 'mini') setPhase('compact');
          }, geoDur('hidden', 'mini') + 60);
        });
      } else {
        setPhase('compact');
      }
    }

    function sleep() {
      clearTimeout(state.alertTimer);
      state.alertTimer = null;
      closePanel();
      if (state.phase === 'hidden') return;
      const shrink = geoDur(state.phase, 'mini');
      setPhase('mini');
      setTimeout(() => {
        if (!state.visible) setPhase('hidden');
      }, shrink + 600);
    }

    function showAlert(payload) {
      if (!state.visible) return;
      const text = String((payload && payload.text) || '').trim();
      if (!text) return;
      const hold = clamp(payload.ms || state.config.island_alert_hold_ms, 100, 5000, 600);
      state.alertType = payload.type === 'success' ? 'success' : (payload.type === 'error' ? 'error' : 'info');
      document.body.dataset.alertType = state.alertType;
      closePanel();
      setPhase('alert');
      setText(text.length > 26 ? text.slice(0, 25) + '…' : text, true);
      clearTimeout(state.alertTimer);
      state.alertTimer = setTimeout(() => {
        state.alertTimer = null;
        if (state.visible) {
          setPhase('compact');
          loadData();
        }
      }, hold);
    }

    function openPanel() {
      if (state.panelOpen) return;
      state.panelOpen = true;
      renderPanel();
      panel.classList.add('open');
      schedulePanelClose();
    }

    function closePanel() {
      if (!state.panelOpen) return;
      state.panelOpen = false;
      panel.classList.remove('open');
      panel.style.height = '0px';
      if (state.panelTimer) {
        clearTimeout(state.panelTimer);
        state.panelTimer = null;
      }
    }

    function togglePanel() {
      if (state.panelOpen) closePanel();
      else openPanel();
    }

    function schedulePanelClose() {
      if (state.panelTimer) clearTimeout(state.panelTimer);
      state.panelTimer = setTimeout(() => {
        state.panelTimer = null;
        closePanel();
      }, 3000);
    }

    function renderPanel() {
      const schedule = currentSchedule();
      if (!schedule) {
        panelBody.innerHTML = '<div class="p-line">今天没有课</div>';
        panel.style.height = (34 + 22) + 'px';
        return;
      }
      const now = new Date();
      const status = computeStatus(schedule, now);
      state.status = status;
      const courses = dayCourses(schedule, now);
      let lines = [];
      if (!courses.length) {
        lines = ['今天没有课'];
      } else {
        lines = courses.map(function (item) {
          const mark = status.index != null && item.index === status.index ? '▶ ' : '';
          return mark + item.course + '  ' + item.start;
        });
      }
      panelBody.innerHTML = lines.map(function (line) {
        return '<div class="p-line">' + escapeHtml(line) + '</div>';
      }).join('');
      panel.style.height = (34 + lines.length * 22) + 'px';
    }

    function renderSub() {
      const cfg = state.config;
      const schedule = currentSchedule();
      const status = state.status || (schedule ? computeStatus(schedule, new Date()) : null);
      const text = status ? subStatusText(status) : '';
      if (text !== state.lastSubText) {
        state.lastSubText = text;
        subText.textContent = text || '—';
        subMark.textContent = (text || '—').charAt(0);
      }
      sub.classList.toggle('collapsed', state.subCollapsed !== false);
      const allowed = state.phase === 'compact' || state.phase === 'countdown';
      document.body.classList.toggle('sub-on', cfg.show_sub_island === true && !!text && allowed);
      updateSubLayout();
    }

    function scheduleSubCollapse() {
      if (state.subTimer) clearTimeout(state.subTimer);
      state.subTimer = null;
      const sec = clamp(state.config.sub_island_auto_collapse_sec, 0, 120, 5);
      if (sec <= 0 || state.subCollapsed) return;
      state.subTimer = setTimeout(() => {
        state.subTimer = null;
        state.subCollapsed = true;
        renderSub();
      }, sec * 1000);
    }

    async function loadData() {
      try {
        const res = await api.getData();
        if (res && res.success && res.data) {
          state.data = res.data;
          if (res.data.schedule) state.schedule = res.data.schedule;
          refreshSchedule(false);
        }
      } catch (e) {}
    }

    function hitTest(x, y) {
      const targets = [island];
      if (state.panelOpen) targets.push(panel);
      if (document.body.classList.contains('sub-on')) targets.push(sub);
      for (const el of targets) {
        const r = el.getBoundingClientRect();
        if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
      }
      return false;
    }

    function setInteractive(v) {
      if (state.lastInteractive === v) return;
      state.lastInteractive = v;
      api.setInteractive(v);
    }

    island.addEventListener('click', () => {
      if (state.phase !== 'compact') return;
      togglePanel();
    });

    island.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      api.showMenu();
    });

    sub.addEventListener('click', (e) => {
      e.stopPropagation();
      state.subCollapsed = !state.subCollapsed;
      renderSub();
      if (!state.subCollapsed) scheduleSubCollapse();
      else if (state.subTimer) { clearTimeout(state.subTimer); state.subTimer = null; }
    });

    sub.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      api.setSetting('show_sub_island', false);
    });

    document.addEventListener('mousemove', (e) => {
      state.lastMouse = { x: e.clientX, y: e.clientY };
      const over = hitTest(e.clientX, e.clientY);
      setInteractive(over);
    });

    document.addEventListener('mouseleave', () => {
      setInteractive(false);
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    api.onVisibility((visible) => {
      state.visible = visible === true;
      if (state.visible) wake();
      else sleep();
    });

    api.onConfig((cfg) => {
      applyConfig(cfg);
      renderSub();
      if (state.visible) {
        if (state.phase === 'hidden') wake();
      }
    });

    api.onAlert((payload) => showAlert(payload));

    api.onData((data) => {
      if (!data) return;
      state.data = data;
      if (data.schedule) state.schedule = data.schedule;
      refreshSchedule(false);
    });

    api.onLocked((locked) => {
      state.locked = locked === true;
      if (state.locked) {
        state.visible = false;
        sleep();
      } else if (isActuallyVisible()) {
        api.getState().then((res) => {
          if (res && res.config) applyConfig(res.config);
          state.visible = true;
          wake();
        }).catch(() => {});
      }
    });

    api.onPreview(() => {
      state.visible = true;
      state.locked = false;
      sleep();
      setTimeout(() => {
        state.visible = true;
        wake();
      }, 420);
      api.getState().then((res) => {
        if (res) {
          applyConfig(res.config);
          state.locked = res.locked === true;
          state.visible = !state.locked && (res.config ? res.config.show_island !== false : true);
        }
      }).catch(() => {});
    });

    window.addEventListener('resize', updateSubLayout);

    (async function init() {
      try {
        const res = await api.getState();
        if (res) {
          state.locked = res.locked === true;
          applyConfig(res.config);
        }
      } catch (e) {}
      await loadData();
      setPhase('hidden');
      setTimeout(() => {
        if (!state.locked && state.config.show_island !== false) {
          state.visible = true;
          wake();
        }
      }, 80);
      setInterval(loadData, 20000);
      setInterval(function () {
        if (!state.visible || state.phase === 'alert' || state.phase === 'hidden') return;
        refreshSchedule(false);
      }, 250);
    })();
  </script>
</body>
</html>
